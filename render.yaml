services:
  # ── Python / Flask backend ─────────────────────────────────────────────────
  - type: web
    name: debt-auditor-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_backend.py
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"   # enforces BYOK + 2-audits/day rate limit on this shared deployment
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ANTHROPIC_API_KEY
        sync: false   # set this manually in Render dashboard (optional server-side default)
      - key: REDIS_URL          # Feature 1: set to your Render Redis internal URL
        sync: false
      - key: AUDIT_TIMEOUT_SECONDS
        value: "600"

  # ── React / Vite frontend (static site) ───────────────────────────────────
  - type: web
    name: debt-auditor-ui
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: debt-auditor-api
          type: web
          property: host

  # ── Celery worker (Feature 1) ──────────────────────────────────────────────
  # Uncomment after adding Redis. Free plan; upgrade to Starter for production.
  # - type: worker
  #   name: debt-auditor-worker
  #   runtime: python
  #   plan: free
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: celery -A backend.worker.celery_app worker --loglevel=info --concurrency=2
  #   envVars:
  #     - key: REDIS_URL
  #       sync: false
  #     - key: ANTHROPIC_API_KEY
  #       sync: false
  #     - key: AUDIT_TIMEOUT_SECONDS
  #       value: "600"

  # ── Redis (Feature 1) ─────────────────────────────────────────────────────
  # Render managed Redis — free tier available.
  # After creating: copy the Internal Redis URL into REDIS_URL on all services above.
  # - type: redis
  #   name: debt-auditor-redis
  #   plan: free
