services:
  # ── Python / Flask backend ─────────────────────────────────────────────────
  - type: web
    name: debt-auditor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_backend.py
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ANTHROPIC_API_KEY
        sync: false   # set this manually in Render dashboard (optional server-side default)

  # ── React / Vite frontend (static site) ───────────────────────────────────
  - type: web
    name: debt-auditor-ui
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: debt-auditor-api
          type: web
          property: onRenderUrl
